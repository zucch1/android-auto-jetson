// RFCOMM bootstrap payloads, head-unit (HU) role, start-first flow (#166).
// Every field number and message ID below matches both shipping HU-role references:
//   aa-proxy/aa-proxy-rs f80236fb17bef459398fa4ae235f86a68574a873
//     src/protos/WifiStartRequest.proto:4-7, src/protos/WifiInfoResponse.proto:4-28,
//     src/bluetooth.rs:409-420 (IDs), 914-923 (status tags), 6284-6323 (flow);
//   nisargjhaveri/WirelessAndroidAutoDongle ef645221ec28e87361391b9bdcf27e31ff48cb6f
//     aa_wireless_dongle/package/aawg/src/proto/WifiStartRequest.proto:4-7,
//     .../proto/WifiInfoResponse.proto:4-28, .../bluetoothProfiles.cpp:32-77 (flow, IDs).
// open-android-auto 61eab61 (vendored oaa/wifi/) agrees on IDs (WifiSetupMessageEnum.proto:34-44),
// WifiStartRequest (WifiStartRequestMessage.proto:16-20), WifiStartResponse status=3
// (WifiStartResponseMessage.proto:20-24) and WifiConnectStatus status=1
// (WifiConnectStatusMessage.proto:20-23). It disagrees on WifiInfoResponse tags 2/3
// (WifiInfoResponseMessage.proto:13-19: bssid=2, passphrase=3); both shipping dongles use
// key=2, bssid=3, so that is what this file encodes.
// The version-negotiation messages (IDs 4/5/11) are deliberately absent: their status values
// are unverified (OAA WifiVersionStatusEnum.proto:18-31 vs aa-proxy-rs bluetooth.rs:4746-4754)
// and no phone capture exists, so the HU never sends them and rejects them if received.
syntax = "proto2";
package aa.helper.aaw;
enum SecurityMode {
  UNKNOWN_SECURITY_MODE = 0;
  WPA_PERSONAL = 4;
  WPA2_PERSONAL = 8;
  WPA_WPA2_PERSONAL = 12;
  WPA_ENTERPRISE = 20;
  WPA2_ENTERPRISE = 24;
  WPA_WPA2_ENTERPRISE = 28;
}
enum AccessPointType { STATIC = 0; DYNAMIC = 1; }
// Wire values of WifiStartResponse.status and WifiConnectStatus.status. Every failure is
// negative. WifiConnectStatus success is 0: aa-proxy-rs bluetooth.rs:4743-4753 treats a phone's
// [08 00] as success and [08 fd ff ff ff ff ff ff ff ff 01] (-3) as a Wi-Fi failure. OAA instead
// maps 1 to success and 0 to unsolicited (WifiVersionStatusEnum.proto:18-31, unverified), which is
// why WifiStartResponse, which no reference checks, accepts any non-negative value.
// Status fields are int32 so an unlisted value still parses and is reported by number.
enum Status {
  STATUS_SUCCESS = 0;
  STATUS_UNSOLICITED_MESSAGE = 1;
  STATUS_NO_COMPATIBLE_VERSION = -1;
  STATUS_WIFI_INACCESSIBLE_CHANNEL = -2;
  STATUS_WIFI_INCORRECT_CREDENTIALS = -3;
  STATUS_PROJECTION_ALREADY_STARTED = -4;
  STATUS_WIFI_DISABLED = -5;
  STATUS_WIFI_NOT_YET_STARTED = -6;
  STATUS_INVALID_HOST = -7;
  STATUS_NO_SUPPORTED_WIFI_CHANNELS = -8;
  STATUS_INSTRUCT_USER_TO_CHECK_THE_PHONE = -9;
  STATUS_PHONE_WIFI_DISABLED = -10;
  STATUS_WIFI_NETWORK_UNAVAILABLE = -11;
}
// ID 1, HU -> phone, sent first.
message WifiStartRequest { required string ip_address = 1; required uint32 port = 2; }
// ID 2, phone -> HU, empty.
message WifiInfoRequest {}
// ID 3, HU -> phone, the only record that carries the AP secret.
message WifiInfoResponse {
  required string ssid = 1;
  required string password = 2;
  required string bssid = 3;
  required SecurityMode security_mode = 4;
  optional AccessPointType access_point_type = 5;
}
// ID 7, phone -> HU. Status optional (OAA WifiStartResponseMessage.proto:20-24); only a
// negative value fails (no reference checks it; OAA maps 1 to success).
message WifiStartResponse {
  optional string ip_address = 1;
  optional uint32 port = 2;
  optional int32 status = 3;
}
// ID 6, phone -> HU, the last record.
message WifiConnectStatus { required int32 status = 1; optional string error_message = 2; }
