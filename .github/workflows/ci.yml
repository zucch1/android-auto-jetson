name: CI

# One run per commit: PR branches (including stacked `aa/**` bases) are
# covered by `pull_request` alone, and `push` is limited to `main`. A push to
# an `aa/**` PR branch used to start a second, identical `push` run.
on:
  pull_request:
    branches: [main, 'aa/**']
    # No `edited`: it cancels and restarts the whole run (including the 600 s ipc bench when it
    # applies) on every title/body edit, and the validators always come from `main` now, so a
    # retarget no longer changes what they check. After retargeting a PR, close and reopen it or
    # push a commit to rerun CI. Do not "fix" this with job-level `if:` skips: a skipped
    # required job counts as passing.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Manual full run (including ipc-bench-happy-600) on any branch.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the superseded PR run. Runs on main
# pushes and dispatches each get a unique group and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  host-build-test:
    name: ci/host-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history: tls_posture_key_scan_reencodings re-derives the known
          # historical credential (read-only) from blob OIDs pinned in
          # third_party/provenance/inventory.json to plant re-encodings.
          fetch-depth: 0
      - name: Provision host-only AASDK and decode smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build cmake g++ \
            libprotobuf-dev protobuf-compiler libboost-system-dev libboost-log-dev \
            libssl-dev libusb-1.0-0-dev pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good gstreamer1.0-pipewire pipewire-bin wireplumber \
            pipewire-pulse pulseaudio-utils dbus-daemon qt6-base-dev valgrind \
            g++-aarch64-linux-gnu binutils ccache
          protoc --version
          valgrind --version
          dpkg-query -W libprotobuf-dev protobuf-compiler libboost-system-dev \
            libboost-log-dev libssl-dev libusb-1.0-0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good gstreamer1.0-pipewire pipewire-bin wireplumber \
            pipewire-pulse pulseaudio-utils dbus-daemon qt6-base-dev valgrind
          gst-inspect-1.0 openh264dec
          gst-inspect-1.0 h264parse
          gst-inspect-1.0 pipewiresink
          gst-inspect-1.0 pulsesink
      - name: Identify compiler cache inputs
        id: compiler
        run: |
          set -euo pipefail
          identity="$( { g++ --version; sha256sum "$(readlink -f "$(command -v g++)")"; } | sha256sum | cut -d ' ' -f 1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore compiler objects
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/manifest.lock') }}-${{ github.sha }}
          # ccache validates every object by content (CCACHE_COMPILERCHECK=content,
          # preprocessor mode), so a broader fallback key cannot produce a wrong
          # object; it only avoids a cold build whenever any CMake file changes.
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/manifest.lock') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-
      - name: Configure compiler cache
        run: |
          set -euo pipefail
          # Objects only: source staging/hash/provenance gates still run every time.
          # Preprocessor mode rechecks headers; no sloppiness or ignored inputs.
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo 'CCACHE_MAXSIZE=500M' >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
          echo 'CCACHE_NODIRECT=true' >> "$GITHUB_ENV"
      - name: Fetch and verify locked GoogleTest archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-v1.15.2.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://codeload.github.com/google/googletest/tar.gz/refs/tags/v1.15.2 \
            --output "$archive"
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock --archive "$archive"
      - name: Start user-session audio runtime for the audio pipeline tests
        run: |
          set -euo pipefail
          # The audio pipeline route tests open the DEFAULT output of the user
          # session: pipewiresink streams are auto-linked by the session
          # manager and the explicit-pulse route drives pulsesink against a
          # Pulse server. The bare runner has no audio runtime and no
          # Audio/Sink at all, so start one here and leave the daemons running
          # for the test step; pipewire-pulse also provides the auto_null /
          # Dummy Output fallback sink the routes land on. The isolated
          # backend tests spawn their own daemons but need the same packages
          # (pipewire binary + /usr/share/pipewire/pipewire.conf template,
          # wireplumber, dbus-daemon) installed here.
          if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -d "$XDG_RUNTIME_DIR" ]; then
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
          fi
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_RUNTIME_DIR
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # wireplumber exits immediately without a session bus, so give the
          # daemons a private one (same shape as the isolation harness).
          export DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address)"
          nohup pipewire >"$RUNNER_TEMP/pipewire.log" 2>&1 &
          deadline=$((SECONDS + 15))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ -S "$XDG_RUNTIME_DIR/pipewire-0" ]; then break; fi
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/pipewire-0"
          nohup wireplumber >"$RUNNER_TEMP/wireplumber.log" 2>&1 &
          nohup pipewire-pulse >"$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          # Bounded two-gate readiness: wall-clock deadline of 30 s (probe
          # execution time counts against the budget), every wpctl/pactl call
          # wrapped in `timeout 5s`, so a stalled connection cannot hang the
          # step. Both gates must pass:
          #   1. default-sink-resolves - `wpctl inspect '@DEFAULT_AUDIO_SINK@'`
          #      resolves the default Audio/Sink directly (non-zero until
          #      wireplumber adopts the auto_null / Dummy Output fallback);
          #      no `wpctl status` section parsing, so a stray `*` outside
          #      Sinks cannot satisfy the gate;
          #   2. pulse-round-trip - `pactl info` proves pipewire-pulse still
          #      accepts Pulse connections. wpctl alone can pass while
          #      pipewire-pulse is dead, but the explicit-pulse route drives
          #      pulsesink against that server. Never wait forever.
          ready=""
          deadline=$((SECONDS + 30))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if timeout 5s wpctl inspect '@DEFAULT_AUDIO_SINK@' >/dev/null 2>&1 \
                && timeout 5s pactl info >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "::error::audio runtime not ready within the bounded wait (default Audio/Sink + Pulse connection)" >&2
            tail -n 20 "$RUNNER_TEMP"/pipewire.log "$RUNNER_TEMP"/wireplumber.log \
              "$RUNNER_TEMP"/pipewire-pulse.log || true
            timeout 5s wpctl inspect '@DEFAULT_AUDIO_SINK@' || true
            timeout 5s wpctl status || true
            timeout 5s pactl info || true
            exit 1
          fi
          timeout 5s wpctl status
          timeout 5s wpctl inspect '@DEFAULT_AUDIO_SINK@' >/dev/null
          timeout 5s pactl info
      - name: Configure, build and qualify native AASDK and host foundation
        env:
          AA_GOOGLETEST_ARCHIVE: ${{ runner.temp }}/googletest-v1.15.2.tar.gz
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencode
          cmake --preset host-dev -DAA_GOOGLETEST_ARCHIVE="$AA_GOOGLETEST_ARCHIVE" -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset host-dev --parallel 4
          python3 -B tests/media/assert_decode_coverage.py build/host-dev
          python3 -B tests/ipc/assert_ipc_coverage.py build/host-dev
          python3 -B tests/wireless/assert_coverage.py build/host-dev
          ctest --test-dir build/host-dev -R aasdk_abi --output-on-failure -V
          # Mandatory input-sensor memcheck qualification (gate r1): run the
          # dedicated memcheck gate first, verbose and serial (memcheck must
          # not race its own leak scan). It FAILS (never skips) when valgrind
          # is missing or a run claims SKIPPED.
          ctest --test-dir build/host-dev --no-tests=error --output-on-failure -V \
            -R '^input_sensors_memory$' -j 1
          # input_sensors_memory is excluded here: it already ran above (avoid a double
          # memcheck pass), and its sentinel semantics are qualified by that step.
          exclude='^input_sensors_memory$'
          # ipc-bench-happy-600 is the 600 s IPC throughput gate (~10 minutes). It runs
          # on every push to main and on workflow_dispatch. On a pull request
          # it runs unless tools/ci/ipc_bench_gate.py proves the PR leaves the benchmark
          # unchanged: it configures the PR base in a scratch worktree and compares the
          # bench sources, every ninja command that builds aa-ipc-bench (flags, defines,
          # link line) and the test registration against this merge result. Any
          # difference or error runs the gate. Every other test, including
          # input_sensors_memory above, runs on every PR. A PR that edits this
          # workflow always runs the gate: both trees are configured under the PR's
          # runner image and provisioning, so an environment change (image, apt
          # packages, system libraries) would not show up in the comparison.
          bench='run'
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            base_tree="$RUNNER_TEMP/ipc-bench-base"
            if ! git diff --quiet "$PR_BASE_SHA" HEAD -- .github/workflows/ci.yml; then
              echo 'ipc-bench-gate RUN: .github/workflows/ci.yml differs from the PR base (or the diff failed)'
            elif git worktree add --detach "$base_tree" "$PR_BASE_SHA" \
                && (cd "$base_tree" && cmake --preset host-dev \
                      -DAA_GOOGLETEST_ARCHIVE="$AA_GOOGLETEST_ARCHIVE" -DBUILD_TESTING=ON \
                      -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                      >"$RUNNER_TEMP/ipc-bench-base-configure.log" 2>&1) \
                && python3 -B tools/ci/ipc_bench_gate.py \
                      --base-src "$base_tree" --base-build "$base_tree/build/host-dev" \
                      --head-src "$PWD" --head-build build/host-dev; then
              bench='deferred'
              exclude='^(input_sensors_memory|ipc-bench-happy-600)$'
            else
              tail -n 20 "$RUNNER_TEMP/ipc-bench-base-configure.log" 2>/dev/null || true
            fi
            git worktree remove --force "$base_tree" 2>/dev/null || true
          fi
          echo "ipc-bench-happy-600: $bench (event: $GITHUB_EVENT_NAME)"
          {
            echo '## ci/host-build-test'
            echo
            if [ "$bench" = 'deferred' ]; then
              echo '- `ipc-bench-happy-600`: deferred to the post-merge run on `main` (sources, build commands and registration identical to the PR base).'
            else
              echo '- `ipc-bench-happy-600`: ran in this job.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          ctest --preset host-dev --output-on-failure --parallel 4 -E "$exclude"
          ccache --show-stats

  decode-overlay-cross:
    name: ci/decode-overlay-cross
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision public synthetic cross fixture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build cmake \
            g++-aarch64-linux-gnu pkg-config binutils libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - name: Require AVAILABLE probe, AArch64 ELF and bound overlay provenance
        run: |
          set -euo pipefail
          python3 -B tests/media/cross_decode_overlay.py --scratch "$RUNNER_TEMP/decode-overlay-cross"
      - name: Fetch and verify locked GoogleTest archive for root integration
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-v1.15.2.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://codeload.github.com/google/googletest/tar.gz/refs/tags/v1.15.2 \
            --output "$archive"
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock --archive "$archive"
      - name: Require full root cross provenance with an external overlay
        run: |
          set -euo pipefail
          python3 -B tests/media/cross_decode_overlay.py --root-project \
            --archive "$RUNNER_TEMP/googletest-v1.15.2.tar.gz" \
            --scratch "$RUNNER_TEMP/decode-root-cross"

  # M5 (trusted validators). A SEPARATE job on a fresh runner: nothing from the PR is executed
  # before the validators run, so a PR step cannot poison them through $GITHUB_ENV (BASH_ENV,
  # PATH, ...), $GITHUB_PATH or a shell function. The validator CODE always comes from the
  # repository default branch (main), never from the PR's base ref (a stacked `aa/X` base is
  # author-pushable) and never from the PR itself; the PR tree is only passed to them as DATA (a path argument): no PR script is run, no PR
  # file is sourced, and the interpreter is invoked by absolute path from a scrubbed environment
  # (`env -i`, `-B -s -E`; not `-I`, because the validators import their sibling modules from
  # the base directory). It runs on EVERY event (pull_request, push, workflow_dispatch) and the gate
  # below accepts only `success`, so `gh workflow run ci.yml --ref <pr-branch>` cannot yield a green
  # ci/provenance-lint without it. A PR that legitimately changes one of these
  # validators or their pinned constants fails here by design: land the validator change on its
  # own first (explicit owner review), then rebase the data change on it. That order does not
  # work when a validator's pinned constant and the data it checks must change together
  # (check_manifest.py + deps/manifest.lock): make the change backward compatible, accept a red
  # main between two merges, or use an admin bypass.
  # RESIDUAL: workflow files come from the PR, so a PR can edit or delete these jobs, and can
  # ADD a new workflow under .github/workflows/ with a job named ci/provenance-lint. Anything
  # under .github/workflows/ needs owner review; enforcing it needs pull_request_target or a
  # ruleset, not done here. The workflow_dispatch closure (a dispatch on an old PR branch cannot
  # turn the gate green) relied on the ruleset's strict "require branches to be up to date"
  # setting, which is now OFF: a branch predating base-validators carries the old gate, so a
  # dispatch on it can produce a green ci/provenance-lint without the trusted validators. The
  # compensating practice is to merge only branches whose latest CI run used the current workflow
  # and to check main's runs after each batch of merges.
  base-validators:
    name: ci/base-validators
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the default branch (validator code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Literal: an empty `ref` would make actions/checkout silently fall back to the
          # event ref (the PR merge commit).
          ref: main
          path: base
          persist-credentials: false
      - name: Check out the tree under test (data only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pr
          persist-credentials: false
      - name: Run base-revision validators against the PR tree
        run: |
          set -euo pipefail
          py=/usr/bin/python3
          run_base() {
            # Scrubbed env; the PR tree is only ever an argument or the working directory.
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
              "$py" -B -s -E "$@"
          }
          base="$GITHUB_WORKSPACE/base"
          pr="$GITHUB_WORKSPACE/pr"
          # The validator checkout must really be main: on branch main, at the fetched origin/main.
          [ "$(/usr/bin/git -C "$base" symbolic-ref --short HEAD)" = main ] \
            || { echo "validator checkout is not on branch main"; exit 1; }
          [ "$(/usr/bin/git -C "$base" rev-parse HEAD)" = "$(/usr/bin/git -C "$base" rev-parse refs/remotes/origin/main)" ] \
            || { echo "validator checkout is not at origin/main"; exit 1; }
          cd "$pr"
          run_base "$base/tools/deps/check_manifest.py" --lock "$pr/deps/manifest.lock"
          run_base "$base/tools/provenance/check.py" --root "$pr"
          run_base "$base/tools/tls/scan.py" "$pr"

  # The required context. It cannot pass on a pull request unless ci/base-validators passed
  # (the first step fails the job otherwise, before any PR-controlled step runs). Its remaining
  # steps are the existing in-tree checks, which execute PR code and are therefore not trusted
  # on their own.
  provenance-lint:
    name: ci/provenance-lint
    needs: base-validators
    # A skipped dependency would otherwise skip this job, and GitHub counts a skipped job as
    # passing for a required check: always run, and decide explicitly below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the trusted base-revision validators
        env:
          EVENT: ${{ github.event_name }}
          BASE_RESULT: ${{ needs.base-validators.result }}
        run: |
          set -euo pipefail
          # Only `success` passes, for every event type: a skipped, cancelled or failed
          # base-validators job (or a dispatch/push that skipped it) never satisfies this gate.
          case "$BASE_RESULT" in
            success) ;;
            *) echo "ci/base-validators result '$BASE_RESULT' on '$EVENT' does not allow ci/provenance-lint"; exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify provenance and dependency identities
        run: |
          set -euo pipefail
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock
          tools/provenance/check.sh
      - name: Reject malicious provenance mutations in scratch fixtures
        run: |
          set -euo pipefail
          for case in baseline overlay content header extra generated license gpl inventory listing symlink missing mode; do
            python3 -B tests/provenance/scenarios.py "$PWD" "$case"
          done
      - name: Verify protobuf audit inventory and guard against schema drift
        run: |
          set -euo pipefail
          python3 -B tools/protocol/protobuf_audit.py --check
          for case in baseline drift-inventory report-drift missing-file tampered-proto unpinned-file listing-tampered repin-comment field-number-changed field-type-changed enum-value-removed new-unmatched-message vanished-difference unparsed-construct finding-dangling-diff uncovered-by-removal duplicate-id missing-field invalid-disposition status-mismatch unexplained-deletion nonlegacy-deletion legacy-altered citation-broken absence-stale crosslink-dangling orphan-finding mapping-dangling triage-missing-diff triage-dangling-diff triage-invalid-disposition triage-missing-metadata sentinel-false-match genuine-rename-still-matches renamed-enums-path-only zero-only-enum-false-match message-path-shape-boundary; do
            python3 -B tests/protocol/audit_scenarios.py "$PWD" "$case"
          done

  # Required public ARM64 cross-build check (fixture-only). It must NEVER share the
  # `ci/arm64-cross-build` name: that optional target-evidence context is posted solely by
  # tools/ci/arm64-cross-relay.sh after an observed-sysroot, sandboxed build (see
  # docs/CONTRIBUTING.md), so fixture results cannot claim observed-sysroot acceptance.
  arm64-cross-fixture:
    name: ci/arm64-cross-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision aarch64 cross toolchain for the fixture cross build
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build cmake \
            g++-aarch64-linux-gnu pkg-config binutils
          aarch64-linux-gnu-g++ --version
      - name: Fetch and verify locked GoogleTest archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-v1.15.2.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://codeload.github.com/google/googletest/tar.gz/refs/tags/v1.15.2 \
            --output "$archive"
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock --archive "$archive"
      - name: Generate fixture sysroot into RUNNER_TEMP (fixture-not-target)
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tests/media')
          from decode_cross_fixture import make_sysroot

          base = Path(os.environ['RUNNER_TEMP']) / 'arm64-cross-fixture'
          base.mkdir(parents=True, exist_ok=False)
          rootfs, manifest = make_sysroot(base)
          if not rootfs.is_dir() or not manifest.is_file():
              raise SystemExit('FIXTURE_SYSROOT_GENERATION_FAILED')
          cache = base / 'build-binding'
          cache.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'AA_SYSROOT_ROOTFS={rootfs}\n')
              environment.write(f'AA_SYSROOT_PAYLOAD={rootfs}\n')
              environment.write(f'AA_SYSROOT_MANIFEST={manifest}\n')
              environment.write(f'AA_SYSROOT_CACHE={cache}\n')
              environment.write('AA_SYSROOT_REQUIRE_OBSERVED=OFF\n')
          print(f'fixture sysroot generated (fixture-not-target): rootfs={rootfs} manifest={manifest}')
          PY
      - name: Configure and cross-build against the fixture sysroot
        env:
          AA_GOOGLETEST_ARCHIVE: ${{ runner.temp }}/googletest-v1.15.2.tar.gz
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencode
          export PKG_CONFIG_PATH=
          test -d "${AA_SYSROOT_ROOTFS:?AA_SYSROOT_ROOTFS must be set}"
          test -f "${AA_SYSROOT_MANIFEST:?AA_SYSROOT_MANIFEST must be set}"
          test "${AA_SYSROOT_REQUIRE_OBSERVED:?AA_SYSROOT_REQUIRE_OBSERVED must be set}" = "OFF"
          cmake --preset jetson-aarch64
          cmake --build --preset jetson-aarch64
      - name: Cross-build IPC libraries explicitly and verify the cross inventory
        env:
          AA_GOOGLETEST_ARCHIVE: ${{ runner.temp }}/googletest-v1.15.2.tar.gz
        run: |
          set -euo pipefail
          cmake --build --preset jetson-aarch64 --target aa_ipc_control aa_ipc_dbus
          python3 -B tests/dbus/assert_dbus_coverage.py --cross build/jetson-aarch64
      - name: Verify hardening of every project-owned cross executable
        run: |
          set -euo pipefail
          ctest --test-dir build/jetson-aarch64 --no-tests=error --output-on-failure -R '^build_hardening$'
      - name: State fixture-not-target scope in the step summary
        run: |
          set -euo pipefail
          {
            echo '## ci/arm64-cross-fixture (fixture mode)'
            echo
