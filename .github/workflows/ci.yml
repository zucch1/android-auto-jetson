name: CI

on:
  pull_request:
    branches: [main, 'aa/**']
  push:
    branches: [main, 'aa/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  host-build-test:
    name: ci/host-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history: tls_posture_key_scan_reencodings re-derives the known
          # historical credential (read-only) from blob OIDs pinned in
          # third_party/provenance/inventory.json to plant re-encodings.
          fetch-depth: 0
      - name: Provision host-only AASDK and decode smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build cmake g++ \
            libprotobuf-dev protobuf-compiler libboost-system-dev libboost-log-dev \
            libssl-dev libusb-1.0-0-dev pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good gstreamer1.0-pipewire pipewire-bin wireplumber \
            pipewire-pulse pulseaudio-utils dbus-daemon qt6-base-dev valgrind \
            g++-aarch64-linux-gnu binutils
          protoc --version
          valgrind --version
          dpkg-query -W libprotobuf-dev protobuf-compiler libboost-system-dev \
            libboost-log-dev libssl-dev libusb-1.0-0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good gstreamer1.0-pipewire pipewire-bin wireplumber \
            pipewire-pulse pulseaudio-utils dbus-daemon qt6-base-dev valgrind
          gst-inspect-1.0 openh264dec
          gst-inspect-1.0 h264parse
          gst-inspect-1.0 pipewiresink
          gst-inspect-1.0 pulsesink
      - name: Fetch and verify locked GoogleTest archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-v1.15.2.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://codeload.github.com/google/googletest/tar.gz/refs/tags/v1.15.2 \
            --output "$archive"
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock --archive "$archive"
      - name: Start user-session audio runtime for the audio pipeline tests
        run: |
          set -euo pipefail
          # The audio pipeline route tests open the DEFAULT output of the user
          # session: pipewiresink streams are auto-linked by the session
          # manager and the explicit-pulse route drives pulsesink against a
          # Pulse server. The bare runner has no audio runtime and no
          # Audio/Sink at all, so start one here and leave the daemons running
          # for the test step; pipewire-pulse also provides the auto_null /
          # Dummy Output fallback sink the routes land on. The isolated
          # backend tests spawn their own daemons but need the same packages
          # (pipewire binary + /usr/share/pipewire/pipewire.conf template,
          # wireplumber, dbus-daemon) installed here.
          if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -d "$XDG_RUNTIME_DIR" ]; then
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
          fi
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_RUNTIME_DIR
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # wireplumber exits immediately without a session bus, so give the
          # daemons a private one (same shape as the isolation harness).
          export DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address)"
          nohup pipewire >"$RUNNER_TEMP/pipewire.log" 2>&1 &
          deadline=$((SECONDS + 15))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ -S "$XDG_RUNTIME_DIR/pipewire-0" ]; then break; fi
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/pipewire-0"
          nohup wireplumber >"$RUNNER_TEMP/wireplumber.log" 2>&1 &
          nohup pipewire-pulse >"$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          # Bounded two-gate readiness: wall-clock deadline of 30 s (probe
          # execution time counts against the budget), every wpctl/pactl call
          # wrapped in `timeout 5s`, so a stalled connection cannot hang the
          # step. Both gates must pass:
          #   1. default-sink-resolves - `wpctl inspect '@DEFAULT_AUDIO_SINK@'`
          #      resolves the default Audio/Sink directly (non-zero until
          #      wireplumber adopts the auto_null / Dummy Output fallback);
          #      no `wpctl status` section parsing, so a stray `*` outside
          #      Sinks cannot satisfy the gate;
          #   2. pulse-round-trip - `pactl info` proves pipewire-pulse still
          #      accepts Pulse connections. wpctl alone can pass while
          #      pipewire-pulse is dead, but the explicit-pulse route drives
          #      pulsesink against that server. Never wait forever.
          ready=""
          deadline=$((SECONDS + 30))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if timeout 5s wpctl inspect '@DEFAULT_AUDIO_SINK@' >/dev/null 2>&1 \
                && timeout 5s pactl info >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "::error::audio runtime not ready within the bounded wait (default Audio/Sink + Pulse connection)" >&2
            tail -n 20 "$RUNNER_TEMP"/pipewire.log "$RUNNER_TEMP"/wireplumber.log \
              "$RUNNER_TEMP"/pipewire-pulse.log || true
            timeout 5s wpctl inspect '@DEFAULT_AUDIO_SINK@' || true
            timeout 5s wpctl status || true
            timeout 5s pactl info || true
            exit 1
          fi
          timeout 5s wpctl status
          timeout 5s wpctl inspect '@DEFAULT_AUDIO_SINK@' >/dev/null
          timeout 5s pactl info
      - name: Configure, build and qualify native AASDK and host foundation
        env:
          AA_GOOGLETEST_ARCHIVE: ${{ runner.temp }}/googletest-v1.15.2.tar.gz
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencode
          cmake --preset host-dev -DAA_GOOGLETEST_ARCHIVE="$AA_GOOGLETEST_ARCHIVE" -DBUILD_TESTING=ON
          cmake --build --preset host-dev
          python3 -B tests/media/assert_decode_coverage.py build/host-dev
          python3 -B tests/ipc/assert_ipc_coverage.py build/host-dev
          python3 -B tests/wireless/assert_coverage.py build/host-dev
          ctest --test-dir build/host-dev -R aasdk_abi --output-on-failure -V
          # Mandatory input-sensor memcheck qualification (gate r1): run the
          # dedicated memcheck gate first, verbose and serial (memcheck must
          # not race its own leak scan). It FAILS (never skips) when valgrind
          # is missing or a run claims SKIPPED.
          ctest --test-dir build/host-dev --no-tests=error --output-on-failure -V \
            -R '^input_sensors_memory$' -j 1
          # Unfiltered host-dev run intentionally includes the ipc-bench-happy-600 gate,
          # which adds ~10 minutes; the job timeout above accounts for this explicitly.
          # input_sensors_memory is excluded here: it already ran above (avoid a double
          # memcheck pass), and its sentinel semantics are qualified by that step.
          ctest --preset host-dev --output-on-failure -E '^input_sensors_memory$'

  decode-overlay-cross:
    name: ci/decode-overlay-cross
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision public synthetic cross fixture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build cmake \
            g++-aarch64-linux-gnu pkg-config binutils libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - name: Require AVAILABLE probe, AArch64 ELF and bound overlay provenance
        run: |
          set -euo pipefail
          python3 -B tests/media/cross_decode_overlay.py --scratch "$RUNNER_TEMP/decode-overlay-cross"
      - name: Fetch and verify locked GoogleTest archive for root integration
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-v1.15.2.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://codeload.github.com/google/googletest/tar.gz/refs/tags/v1.15.2 \
            --output "$archive"
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock --archive "$archive"
      - name: Require full root cross provenance with an external overlay
        run: |
          set -euo pipefail
          python3 -B tests/media/cross_decode_overlay.py --root-project \
            --archive "$RUNNER_TEMP/googletest-v1.15.2.tar.gz" \
            --scratch "$RUNNER_TEMP/decode-root-cross"

  provenance-lint:
    name: ci/provenance-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify provenance and dependency identities
        run: |
          set -euo pipefail
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock
          tools/provenance/check.sh
      - name: Reject malicious provenance mutations in scratch fixtures
        run: |
          set -euo pipefail
          for case in baseline overlay content header extra generated license gpl inventory listing symlink missing mode; do
            python3 -B tests/provenance/scenarios.py "$PWD" "$case"
          done

  arm64-cross-build:
    name: ci/arm64-cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision aarch64 cross toolchain for the fixture cross build
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build cmake \
            g++-aarch64-linux-gnu pkg-config binutils
          aarch64-linux-gnu-g++ --version
      - name: Fetch and verify locked GoogleTest archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletest-v1.15.2.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://codeload.github.com/google/googletest/tar.gz/refs/tags/v1.15.2 \
            --output "$archive"
          python3 -B tools/deps/check_manifest.py --lock deps/manifest.lock --archive "$archive"
      - name: Generate fixture sysroot into RUNNER_TEMP (fixture-not-target)
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tests/media')
          from decode_cross_fixture import make_sysroot

          base = Path(os.environ['RUNNER_TEMP']) / 'arm64-cross-fixture'
          base.mkdir(parents=True, exist_ok=False)
          rootfs, manifest = make_sysroot(base)
          if not rootfs.is_dir() or not manifest.is_file():
              raise SystemExit('FIXTURE_SYSROOT_GENERATION_FAILED')
          cache = base / 'build-binding'
          cache.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'AA_SYSROOT_ROOTFS={rootfs}\n')
              environment.write(f'AA_SYSROOT_PAYLOAD={rootfs}\n')
              environment.write(f'AA_SYSROOT_MANIFEST={manifest}\n')
              environment.write(f'AA_SYSROOT_CACHE={cache}\n')
              environment.write('AA_SYSROOT_REQUIRE_OBSERVED=OFF\n')
          print(f'fixture sysroot generated (fixture-not-target): rootfs={rootfs} manifest={manifest}')
          PY
      - name: Configure and cross-build against the fixture sysroot
        env:
          AA_GOOGLETEST_ARCHIVE: ${{ runner.temp }}/googletest-v1.15.2.tar.gz
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencode
          export PKG_CONFIG_PATH=
          test -d "${AA_SYSROOT_ROOTFS:?AA_SYSROOT_ROOTFS must be set}"
          test -f "${AA_SYSROOT_MANIFEST:?AA_SYSROOT_MANIFEST must be set}"
          test "${AA_SYSROOT_REQUIRE_OBSERVED:?AA_SYSROOT_REQUIRE_OBSERVED must be set}" = "OFF"
          cmake --preset jetson-aarch64
          cmake --build --preset jetson-aarch64
      - name: Cross-build IPC libraries explicitly and verify the cross inventory
        env:
          AA_GOOGLETEST_ARCHIVE: ${{ runner.temp }}/googletest-v1.15.2.tar.gz
        run: |
          set -euo pipefail
          cmake --build --preset jetson-aarch64 --target aa_ipc_control aa_ipc_dbus
          python3 -B tests/dbus/assert_dbus_coverage.py --cross build/jetson-aarch64
      - name: State fixture-not-target scope in the step summary
        run: |
          set -euo pipefail
          {
            echo '## ci/arm64-cross-build (fixture mode)'
            echo
            echo 'Fixture-sysroot cross build (fixture-not-target). This is NOT target qualification — the private observed-sysroot exact-SHA smoke (sysroot jetson-r39.2.1) is the acceptance evidence (task 5 receipts / F3 later).'
            echo
            echo "- head: \`${GITHUB_SHA}\`"
            echo '- env: AA_SYSROOT_REQUIRE_OBSERVED=OFF; fixture provenance is accepted here and always reported fixture-not-target.'
            echo '- commands validated locally in fixture mode before this PR (transcript in the PR body).'
          } >> "$GITHUB_STEP_SUMMARY"
